name: yt-auto

on:
  push:
    paths:
      - ".github/workflows/yt.yml"
  schedule:
    # Daily 20:00 Asia/Kolkata (14:30 UTC)
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_CHANNELA_JSON: ${{ secrets.TOKEN_CHANNELA_JSON }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::Missing GEMINI_API_KEY secret. Add it in GitHub Actions secrets." && exit 1)
          test -n "$CLIENT_SECRET_JSON" || (echo "::error::Missing CLIENT_SECRET_JSON secret" && exit 1)
          test -n "$TOKEN_CHANNELA_JSON" || (echo "::error::Missing TOKEN_CHANNELA_JSON secret" && exit 1)
          test -n "$CONFIG_YAML" || (echo "::error::Missing CONFIG_YAML secret" && exit 1)

      - name: Write credentials and configuration
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_CHANNELA_JSON: ${{ secrets.TOKEN_CHANNELA_JSON }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          mkdir -p tokens
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_CHANNELA_JSON" > tokens/channelA.json
          printf '%s' "$CONFIG_YAML" > config.yaml
          chmod 600 client_secret.json tokens/channelA.json config.yaml

      - name: Validate configuration and OAuth JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          token = json.loads(Path("tokens/channelA.json").read_text())
          required_token_fields = ["client_id", "refresh_token", "client_secret"]
          missing_token_fields = [key for key in required_token_fields if not token.get(key)]
          if missing_token_fields:
              raise SystemExit(
                  "TOKEN_CHANNELA_JSON is missing required fields: "
                  + ", ".join(missing_token_fields)
              )
          print("OAuth token JSON: valid")

          try:
              config = yaml.safe_load(Path("config.yaml").read_text())
          except yaml.YAMLError as exc:
              mark = getattr(exc, "problem_mark", None)
              where = f" at line {mark.line + 1}, column {mark.column + 1}" if mark else ""
              raise SystemExit(
                  "CONFIG_YAML secret is invalid YAML" + where
                  + ". Copy config.example.yaml exactly, preserve indentation, and use spaces (not tabs)."
              ) from exc

          if not isinstance(config, dict) or not isinstance(config.get("channels"), list) or not config["channels"]:
              raise SystemExit("CONFIG_YAML must contain top-level timezone/client_secret_file and a non-empty channels list.")
          for channel in config["channels"]:
              for key in ("name", "drive_ready_folder_id", "drive_uploaded_folder_id", "niche", "category_id", "slots"):
                  if not channel.get(key):
                      raise SystemExit(f"Channel config is missing required field: {key}")
              if channel["drive_uploaded_folder_id"] == "UPLOADED_FOLDER_ID":
                  raise SystemExit("Replace UPLOADED_FOLDER_ID with the real destination Drive folder ID.")
          print("YAML config: valid")
          PY

      - name: Upload and schedule videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python main.py daily

      - name: Save upload state
        if: always()
        run: |
          git config user.name "yt-auto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.db
          if git diff --cached --quiet; then
            echo "No upload-state changes to save."
          else
            git commit -m "update upload state"
            git push
          fi
