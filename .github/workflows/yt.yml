name: yt-auto
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: yt-auto
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_CHANNELA_JSON: ${{ secrets.TOKEN_CHANNELA_JSON }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          mkdir -p tokens
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_CHANNELA_JSON" > tokens/channelA.json
          printf '%s' "$CONFIG_YAML" > config.yaml
      - name: Upload and schedule videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py daily
      - name: Save state
        if: always()
        run: |
          git config user.name "yt-auto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.db
          git commit -m "update state" || echo "no changes"
          git push || true
